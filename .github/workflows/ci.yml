name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 首版仓库还没有 pnpm-lock.yaml，故用 --no-frozen-lockfile。
      # lockfile 由 PM 首次提交后，本行应改为 --frozen-lockfile。
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Guard - core must not import electron
        shell: bash
        run: |
          if grep -rE "from ['\"]electron" packages/ ; then
            echo "packages/ 不得 import electron" >&2
            exit 1
          fi
          echo "ok: packages/ 无 electron 依赖"

      - name: Guard - DESIGN.md tokens in sync
        run: node packages/ui/tokens/build-tokens.mjs --check

      - name: Guard - no magic values in ui css
        run: node packages/ui/tokens/no-magic.mjs

      - name: Build desktop
        run: pnpm build

  # TASK-T12-01：打包产物 job。仓库当前没有 git remote，push 后自动生效（本机不验）。
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # make-icon.mjs 双分支：win 产 icon.ico；mac 产 icon.icns（iconutil）
      - name: Generate icons
        run: pnpm -C apps/desktop make-icon

      - name: Package (win NSIS)
        if: runner.os == 'Windows'
        run: pnpm -C apps/desktop dist

      - name: "Package (mac DMG, identity: null)"
        if: runner.os == 'macOS'
        # dist:mac = pnpm build + make-icon + electron-builder --mac（裸 builder
        # 会因 out/ 不存在报 index.js corrupted——CI 首跑实证）
        run: pnpm -C apps/desktop dist:mac

      - name: Size guard (R7 ≤ 150 MB)
        if: runner.os == 'Windows'
        run: pnpm -C apps/desktop dist:check

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: septcats-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/latest.yml
          if-no-files-found: error
