name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 首版仓库还没有 pnpm-lock.yaml，故用 --no-frozen-lockfile。
      # lockfile 由 PM 首次提交后，本行应改为 --frozen-lockfile。
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Guard - core must not import electron
        shell: bash
        run: |
          if grep -rE "from ['\"]electron" packages/ ; then
            echo "packages/ 不得 import electron" >&2
            exit 1
          fi
          echo "ok: packages/ 无 electron 依赖"

      - name: Build desktop
        run: pnpm build
