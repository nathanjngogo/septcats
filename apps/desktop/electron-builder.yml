# TASK-T12-01 · M10 打包配置（工程师 CodeBuddy，裁决项见任务书 §0）
# 唯一新增外部依赖 = electron-builder（devDependency）；更新器（electron-updater）归 T12-B。
appId: cc.septcats.desktop
productName: Septcats

directories:
  output: dist            # 产物落 apps/desktop/dist/（.gitignore 已含 dist/，不入库）
  buildResources: build   # build/icon.ico 由 scripts/make-icon.mjs 程序化生成

# —— 体积护栏（R7：安装器 ≤ 150 MB）——
asar: true
# TASK-T75-01 §2：整包最大压缩（默认 normal）。GitHub Release 体验向；
# 注：`compression` 是 electron-builder **顶层**选项（NsisOptions 无此键，见 scheme.json），
# 任务书「nsis 段」为笔误 —— 落顶层，登记 DEVIATION-1。
compression: maximum
electronLanguages:
  - zh-CN
  - en
removePackageScripts: true   # 剔 scripts；devDeps 由 builder 默认剔除，此为双保险

# —— 打包内容：electron-vite 三进程产物 + 元信息（运行时依赖由 builder 按 package.json 收集）——
files:
  - out/**
  - package.json

# —— 运行时品牌图标（TASK-T55-02 §1④）——
# `directories.buildResources`（build/）只服务 builder 生成 exe 图标与安装器素材，**不进包**：
# 0.3.0 产物实测 `dist/win-unpacked/resources/` 无 build/、app.asar 顶层仅 node_modules/out/package.json。
# 而 tray.ts / main/index.ts 按 `<resourcesPath>/build/<name>` 探测（打包态首选位），故显式复制四份。
# 体积：四文件合计 <6 KB（T55 新图，无感）。
extraResources:
  - from: build
    to: build
    filter:
      - icon.png
      - icon.ico
      - icon-tray.png
      - icon-tray@2x.png
  # TASK-T72-01 §范围3：内置工作台模板（声明式 JSON，随包更新；运行时按
  # `<resourcesPath>/workbench-templates/*.json` 读取，dev 态回退应用目录 resources/）。
  - from: resources/workbench-templates
    to: workbench-templates
    filter:
      - "*.json"
  # TASK-T75-01 §1：随包字体 Noto Sans SC（SIL OFL 1.1）许可文本。OFL 要求分发时随附
  # 许可副本 —— 源文件由 PM 逐字节落盘（apps/desktop/resources/licenses/OFL-NotoSansSC.txt，
  # 4388 B，禁改）；打包后落 `<resourcesPath>/licenses/`（extraResources 语义 = asar 之外）。
  - from: resources/licenses
    to: licenses
    filter:
      - "*.txt"

# —— Win：NSIS per-user（免管理员，支持 /S 静默安装/卸载）——
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  # 固定形态：Septcats Setup 0.1.0.exe（任务书 §0.3）
  artifactName: ${productName} Setup ${version}.${ext}

# —— mac：本机不构建；老板把仓库拷到 mac 后 `pnpm install && pnpm dist:mac`（make-icon 先跑，
#     icns 归入 VCS 前由 mac 首建提交或构建现场生成）。Q2 一期未签名决议 → identity: null。
#     artifactName 钉「点形式」：与 win 同款纪律（0.4.2 教训——空格名经 gh 归一化会令
#     yml path 与资产名失配；DMG 名直写 Septcats-0.6.0.dmg 无空格，双保险）。
mac:
  icon: build/icon.icns   # 由 make-icon.mjs darwin 分支经 iconutil 生成（仅 macOS 可执行）
  identity: null
  category: public.app-category.productivity
  artifactName: ${productName}-${version}.${ext}
  target:
    - dmg

# —— 自动更新 feed 占位（真地址待老板拍板；仓库无 remote，不许自建）。渠道结构 stable/ 与 beta/ 各一份 latest.yml(.sig)，应用内一期固定 stable（T12-01B §0.5）——
publish:
  - provider: generic
    url: https://github.com/nathanjngogo/septcats-releases/releases/download/latest
  - provider: generic
    url: file:///septcats-feed/beta
