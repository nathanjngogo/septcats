<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 双主题一等公民（§16.3）：让原生控件/滚动条跟随 data-theme -->
    <meta name="color-scheme" content="light dark" />
    <!--
      骨架期的 CSP：只放行本地资源与本机 dev server 的 HMR 连接。
      严格化（去 unsafe-inline / 收敛 connect-src）在 M1 平台层一并处理。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: attachment:; font-src 'self' data:; connect-src 'self' asset: attachment: ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*"
    />
    <title>Septcats</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
